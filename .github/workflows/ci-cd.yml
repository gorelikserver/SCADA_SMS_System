name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_PATH: './SCADASMSSystem.Web.sln'
  PROJECT_PATH: './SCADASMSSystem.Web.csproj'

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build application
      run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release
      
    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --configuration Release --verbosity normal

  publish:
    name: Publish Application
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Publish application (Air-gap compatible)
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output ./publish `
          -p:PublishSingleFile=false `
          -p:PublishTrimmed=false `
          -p:PublishReadyToRun=false `
          -p:SelfContained=true `
          -p:RuntimeIdentifier=win-x64
          
    - name: Create deployment package
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath SCADASMSSystem-${{ github.sha }}.zip
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scada-sms-system-${{ github.sha }}
        path: SCADASMSSystem-${{ github.sha }}.zip
        retention-days: 30

    - name: Create GitHub release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: SCADA SMS System v${{ github.run_number }}
        generate_release_notes: true
        files: SCADASMSSystem-${{ github.sha }}.zip
